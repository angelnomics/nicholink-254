<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management | NichoLink 254</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        .users-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 25px 80px;
        }

        .users-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .users-header h1 {
            margin: 0 0 8px;
            font-size: 36px;
        }

        .users-header p {
            margin: 0;
            opacity: .7;
        }

        .admin-back {
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 10px;
            background: #1f2937;
            color: white;
        }

        /* =========================
           STAT GRID
        ========================= */

        .user-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .user-stat {
            background: white;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,.07);
            border: 1px solid #eee;
        }

        .user-stat span {
            display: block;
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .user-stat strong {
            font-size: 32px;
        }

        /* =========================
           TOOLBAR
        ========================= */

        .users-toolbar {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .users-search {
            flex: 1;
            min-width: 250px;
            padding: 14px 18px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
        }

        .users-filter {
            padding: 14px 18px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: white;
            min-width: 180px;
        }

        /* =========================
           USER GRID
        ========================= */

        .users-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .user-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #eee;
            box-shadow: 0 8px 30px rgba(0,0,0,.06);
            transition: .2s;
        }

        .user-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 35px rgba(0,0,0,.1);
        }

        .user-card-top {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .user-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e8f1ff;
            color: #1769aa;
            font-weight: bold;
            font-size: 20px;
        }

        .user-name {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
        }

        .user-type {
            font-size: 13px;
            color: #777;
            margin-top: 4px;
        }

        .user-info {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }

        .user-info div {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            font-size: 14px;
        }

        .user-info span:first-child {
            color: #777;
        }

        .user-info span:last-child {
            text-align: right;
            word-break: break-word;
        }

        .user-status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: #e8f8ee;
            color: #16803c;
        }

        .status-inactive {
            background: #fdecec;
            color: #c62828;
        }

        .user-actions {
            display: flex;
            gap: 10px;
        }

        .user-actions button {
            flex: 1;
            border: 0;
            border-radius: 10px;
            padding: 11px;
            cursor: pointer;
            font-weight: 600;
        }

        .activate-btn {
            background: #e8f8ee;
            color: #16803c;
        }

        .deactivate-btn {
            background: #fdecec;
            color: #c62828;
        }

        .empty-users {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 20px;
        }

        .loading-users {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
        }

        @media (max-width: 1000px) {

            .users-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .user-stats {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 650px) {

            .users-grid {
                grid-template-columns: 1fr;
            }

            .user-stats {
                grid-template-columns: 1fr;
            }

            .users-header {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>

<body>

<header class="navbar">

    <div class="logo">
        <span>NichoLink</span>
        <strong>254</strong>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="properties.html">Properties</a>
        <a href="admin-dashboard.html">Admin Dashboard</a>
    </nav>

    <a href="admin-dashboard.html" class="nav-button">
        Admin Dashboard
    </a>

</header>


<main class="users-page">

    <section class="users-header">

        <div>
            <p class="property-label">ADMINISTRATION</p>

            <h1>User Management</h1>

            <p>
                Manage NichoLink 254 tenants and landlords.
            </p>
        </div>

        <a href="admin-dashboard.html" class="admin-back">
            ← Dashboard
        </a>

    </section>


    <!-- =========================
         USER STATISTICS
    ========================= -->

    <section class="user-stats">

        <div class="user-stat">
            <span>Total Users</span>
            <strong id="total-users">0</strong>
        </div>

        <div class="user-stat">
            <span>Tenants</span>
            <strong id="total-tenants">0</strong>
        </div>

        <div class="user-stat">
            <span>Landlords</span>
            <strong id="total-landlords">0</strong>
        </div>

        <div class="user-stat">
            <span>Active Users</span>
            <strong id="active-users">0</strong>
        </div>

    </section>


    <!-- =========================
         SEARCH + FILTER
    ========================= -->

    <section class="users-toolbar">

        <input
            type="search"
            id="user-search"
            class="users-search"
            placeholder="Search by name, phone or email..."
        >

        <select id="account-filter" class="users-filter">

            <option value="all">
                All Accounts
            </option>

            <option value="tenant">
                Tenants
            </option>

            <option value="landlord">
                Landlords
            </option>

        </select>

    </section>


    <!-- =========================
         USERS GRID
    ========================= -->

    <section id="users-grid" class="users-grid">

        <div class="loading-users">
            Loading users...
        </div>

    </section>

</main>


<script src="supabase.js"></script>


<script>

let allUsers = [];


/* =========================
   LOAD USERS
========================= */

async function loadUsers() {

    const container =
        document.getElementById("users-grid");

    try {

        const {
            data,
            error
        } = await supabaseClient

            .from("profiles")

            .select(`
                id,
                full_name,
                phone,
                email,
                account_type,
                created_at,
                updated_at,
                is_active
            `)

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {

            throw error;

        }


        allUsers =
            Array.isArray(data)
                ? data
                : [];


        updateStatistics();

        displayUsers(allUsers);

    }

    catch (error) {

        console.error(
            "User loading error:",
            error
        );

        container.innerHTML = `

            <div class="empty-users">

                <h3>
                    Unable to load users
                </h3>

                <p>
                    ${escapeHtml(
                        error.message ||
                        "Unknown error"
                    )}
                </p>

            </div>

        `;

    }

}


/* =========================
   STATISTICS
========================= */

function updateStatistics() {

    const total =
        allUsers.length;


    const tenants =
        allUsers.filter(
            user =>
                String(
                    user.account_type || ""
                ).toLowerCase()
                === "tenant"
        ).length;


    const landlords =
        allUsers.filter(
            user =>
                String(
                    user.account_type || ""
                ).toLowerCase()
                === "landlord"
        ).length;


    const active =
        allUsers.filter(
            user =>
                user.is_active === true
        ).length;


    document.getElementById(
        "total-users"
    ).textContent = total;


    document.getElementById(
        "total-tenants"
    ).textContent = tenants;


    document.getElementById(
        "total-landlords"
    ).textContent = landlords;


    document.getElementById(
        "active-users"
    ).textContent = active;

}


/* =========================
   DISPLAY USERS
========================= */

function displayUsers(users) {

    const container =
        document.getElementById(
            "users-grid"
        );


    if (!users.length) {

        container.innerHTML = `

            <div class="empty-users">

                <h3>
                    No users found
                </h3>

                <p>
                    No users match your search.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML =
        users.map(
            createUserCard
        ).join("");

}


/* =========================
   USER CARD
========================= */

function createUserCard(user) {

    const name =
        user.full_name ||
        "Unnamed User";


    const initials =
        name
            .split(" ")
            .filter(Boolean)
            .slice(0, 2)
            .map(
                word =>
                    word.charAt(0)
                        .toUpperCase()
            )
            .join("");


    const accountType =
        user.account_type ||
        "Unknown";


    const active =
        user.is_active === true;


    const createdDate =
        user.created_at
            ? new Date(
                user.created_at
            ).toLocaleDateString()
            : "Unknown";


    return `

        <article class="user-card">

            <div class="user-card-top">

                <div class="user-avatar">
                    ${escapeHtml(initials || "U")}
                </div>

                <div>

                    <h3 class="user-name">
                        ${escapeHtml(name)}
                    </h3>

                    <div class="user-type">
                        ${escapeHtml(
                            formatAccountType(
                                accountType
                            )
                        )}
                    </div>

                </div>

            </div>


            <div class="user-info">

                <div>
                    <span>Phone</span>
                    <span>
                        ${escapeHtml(
                            user.phone || "Not provided"
                        )}
                    </span>
                </div>

                <div>
                    <span>Email</span>
                    <span>
                        ${escapeHtml(
                            user.email || "Not provided"
                        )}
                    </span>
                </div>

                <div>
                    <span>Joined</span>
                    <span>
                        ${escapeHtml(createdDate)}
                    </span>
                </div>

                <div>
                    <span>Status</span>

                    <span>

                        <span class="user-status ${
                            active
                                ? "status-active"
                                : "status-inactive"
                        }">

                            ${
                                active
                                    ? "Active"
                                    : "Inactive"
                            }

                        </span>

                    </span>

                </div>

            </div>


            <div class="user-actions">

                <button
                    type="button"
                    class="${
                        active
                            ? "deactivate-btn"
                            : "activate-btn"
                    }"
                    onclick="toggleUserStatus(
                        '${escapeHtml(user.id)}',
                        ${!active}
                    )">

                    ${
                        active
                            ? "Deactivate"
                            : "Activate"
                    }

                </button>

            </div>

        </article>

    `;

}


/* =========================
   TOGGLE USER STATUS
========================= */

async function toggleUserStatus(
    userId,
    newStatus
) {

    const action =
        newStatus
            ? "activate"
            : "deactivate";


    const confirmed =
        confirm(
            "Are you sure you want to " +
            action +
            " this user?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const {
            error
        } = await supabaseClient

            .from("profiles")

            .update({
                is_active: newStatus,
                updated_at:
                    new Date().toISOString()
            })

            .eq(
                "id",
                userId
            );


        if (error) {

            throw error;

        }


        await loadUsers();

    }

    catch (error) {

        console.error(
            "Status update error:",
            error
        );

        alert(
            "Unable to update user status.\n\n" +
            (
                error.message ||
                "Unknown error"
            )
        );

    }

}


/* =========================
   SEARCH
========================= */

function filterUsers() {

    const search =
        document.getElementById(
            "user-search"
        )
        .value
        .trim()
        .toLowerCase();


    const accountType =
        document.getElementById(
            "account-filter"
        ).value;


    const filtered =
        allUsers.filter(
            user => {

                const name =
                    String(
                        user.full_name || ""
                    ).toLowerCase();


                const phone =
                    String(
                        user.phone || ""
                    ).toLowerCase();


                const email =
                    String(
                        user.email || ""
                    ).toLowerCase();


                const type =
                    String(
                        user.account_type || ""
                    ).toLowerCase();


                const matchesSearch =
                    !search ||
                    name.includes(search) ||
                    phone.includes(search) ||
                    email.includes(search);


                const matchesType =
                    accountType === "all" ||
                    type === accountType;


                return (
                    matchesSearch &&
                    matchesType
                );

            }
        );


    displayUsers(filtered);

}


document.getElementById(
    "user-search"
).addEventListener(
    "input",
    filterUsers
);


document.getElementById(
    "account-filter"
).addEventListener(
    "change",
    filterUsers
);


/* =========================
   FORMAT ACCOUNT TYPE
========================= */

function formatAccountType(type) {

    const value =
        String(type || "")
            .trim()
            .toLowerCase();


    if (value === "tenant") {
        return "Tenant";
    }


    if (value === "landlord") {
        return "Landlord";
    }


    return type || "Unknown";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

    return String(value)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   START
========================= */

loadUsers();

</script>

</body>

</html>
