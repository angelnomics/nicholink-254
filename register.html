<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | NichoLink 254</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        /* =====================================================
           NICHO LINK 254
           PROFESSIONAL REGISTRATION PAGE
        ===================================================== */


        /* =====================================================
           PAGE
        ===================================================== */

        .register-page {

            min-height: 100vh;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 90px 20px 50px;

            overflow: hidden;

            box-sizing: border-box;

            background:

                radial-gradient(
                    circle at 15% 20%,
                    rgba(0, 132, 61, 0.18),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(0, 132, 61, 0.10),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #14213D 0%,
                    #1C2945 45%,
                    #EEF2F0 100%
                );

        }



        /* =====================================================
           BACKGROUND PATTERN
        ===================================================== */

        .register-page::before {

            content: "";

            position: absolute;

            inset: 0;

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.04) 25%,
                    transparent 25%
                );

            background-size: 40px 40px;

            opacity: 0.35;

            pointer-events: none;

        }



        /* =====================================================
           NAVIGATION
        ===================================================== */

        .register-navbar {

            position: fixed;

            top: 0;

            left: 0;

            right: 0;

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: flex-end;

            padding: 0 35px;

            background:
                rgba(255,255,255,0.97);

            border-bottom:
                1px solid #E5E7EB;

            box-shadow:
                0 4px 20px
                rgba(15,23,42,0.06);

            z-index: 20;

        }



        .register-navbar nav {

            display: flex;

            align-items: center;

            gap: 28px;

        }



        .register-navbar nav a {

            color: #14213D;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            transition:
                color 0.2s ease;

        }



        .register-navbar nav a:hover {

            color: #00843D;

        }



        /* =====================================================
           REGISTRATION CARD
        ===================================================== */

        .register-card {

            width: 100%;

            max-width: 500px;

            position: relative;

            z-index: 10;

            margin-top: 20px;

            padding: 42px;

            box-sizing: border-box;

            background:
                rgba(255,255,255,0.98);

            border:
                1px solid
                rgba(255,255,255,0.8);

            border-radius: 20px;

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.25);

        }



        /* =====================================================
           CARD HEADER
        ===================================================== */

        .register-card-header {

            text-align: center;

            margin-bottom: 30px;

        }



        /* =====================================================
           BRAND MARK
        ===================================================== */

        .register-card-header .brand-mark {

            width: 58px;

            height: 58px;

            margin:
                0 auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 15px;

            background:
                #00843D;

            color:
                #FFFFFF;

            font-size: 20px;

            font-weight: 900;

            letter-spacing: -1px;

            box-shadow:
                0 8px 20px
                rgba(0,132,61,0.25);

        }



        /* =====================================================
           TITLE
        ===================================================== */

        .register-card h1 {

            margin:
                0 0 8px;

            color:
                #14213D;

            font-size:
                30px;

            font-weight:
                850;

            line-height:
                1.2;

        }



        .register-intro {

            margin:
                0;

            color:
                #667085;

            font-size:
                14px;

            line-height:
                1.6;

        }



        /* =====================================================
           FORM LABELS
        ===================================================== */

        .register-card label {

            display:
                block;

            margin-bottom:
                7px;

            color:
                #344054;

            font-size:
                13px;

            font-weight:
                800;

        }



        /* =====================================================
           FORM INPUTS
        ===================================================== */

        .register-card input,
        .register-card select {

            width:
                100%;

            height:
                48px;

            padding:
                0 14px;

            margin-bottom:
                18px;

            box-sizing:
                border-box;

            border:
                1px solid #D0D5DD;

            border-radius:
                10px;

            background:
                #FFFFFF;

            color:
                #14213D;

            font-family:
                inherit;

            font-size:
                14px;

            outline:
                none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;

        }



        .register-card input::placeholder {

            color:
                #98A2B3;

        }



        .register-card input:focus,
        .register-card select:focus {

            border-color:
                #00843D;

            box-shadow:
                0 0 0 3px
                rgba(0,132,61,0.10);

        }



        .register-card select {

            cursor:
                pointer;

        }



        /* =====================================================
           REGISTER BUTTON
        ===================================================== */

        #register-button {

            width:
                100%;

            height:
                50px;

            margin-top:
                5px;

            border:
                none;

            border-radius:
                10px;

            background:
                #00843D;

            color:
                #FFFFFF;

            font-size:
                15px;

            font-weight:
                800;

            cursor:
                pointer;

            box-shadow:
                0 7px 18px
                rgba(0,132,61,0.20);

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }



        #register-button:hover {

            background:
                #006B31;

            transform:
                translateY(-1px);

            box-shadow:
                0 10px 24px
                rgba(0,132,61,0.25);

        }



        #register-button:disabled {

            opacity:
                0.65;

            cursor:
                not-allowed;

            transform:
                none;

        }



        /* =====================================================
           MESSAGE
        ===================================================== */

        #register-message {

            min-height:
                20px;

            margin:
                18px 0 0;

            text-align:
                center;

            font-size:
                13px;

            line-height:
                1.5;

        }



        /* =====================================================
           LOGIN LINK
        ===================================================== */

        .login-link {

            margin:
                24px 0 0;

            padding-top:
                20px;

            border-top:
                1px solid #EAECF0;

            text-align:
                center;

            color:
                #667085;

            font-size:
                14px;

        }



        .login-link a {

            color:
                #00843D;

            font-weight:
                800;

            text-decoration:
                none;

        }



        .login-link a:hover {

            text-decoration:
                underline;

        }



        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .register-navbar {

                height:
                    62px;

                padding:
                    0 18px;

            }



            .register-navbar nav {

                gap:
                    18px;

            }



            .register-navbar nav a {

                font-size:
                    12px;

            }



            .register-page {

                padding:
                    85px 15px 30px;

            }



            .register-card {

                padding:
                    30px 22px;

                border-radius:
                    17px;

            }



            .register-card h1 {

                font-size:
                    27px;

            }

        }



        /* =====================================================
           SMALL PHONES
        ===================================================== */

        @media (max-width: 420px) {

            .register-navbar nav {

                gap:
                    12px;

            }



            .register-navbar nav a {

                font-size:
                    11px;

            }



            .register-card {

                padding:
                    26px 18px;

            }

        }

    </style>

</head>



<body>


<!-- =====================================================
     NAVIGATION
===================================================== -->

<header class="register-navbar">

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="properties.html">
            Properties
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>



<!-- =====================================================
     REGISTRATION PAGE
===================================================== -->

<main class="register-page">


    <!-- =================================================
         REGISTRATION CARD
    ================================================== -->

    <section class="register-card">


        <!-- CARD HEADER -->

        <div class="register-card-header">


            <!-- SIMPLE BRAND MARK -->

            <div class="brand-mark">

                NL

            </div>



            <h1>

                Create Account

            </h1>



            <p class="register-intro">

                Join NichoLink 254 and find,
                connect and grow.

            </p>


        </div>



        <!-- =================================================
             REGISTRATION FORM
        ================================================== -->

        <form id="register-form">


            <!-- FULL NAME -->

            <label for="full_name">

                Full Name

            </label>


            <input
                type="text"
                id="full_name"
                required
                placeholder="Enter your full name"
                autocomplete="name"
            >



            <!-- PHONE -->

            <label for="phone">

                Phone Number

            </label>


            <input
                type="tel"
                id="phone"
                required
                placeholder="07XXXXXXXX"
                autocomplete="tel"
            >



            <!-- EMAIL -->

            <label for="email">

                Email Address

            </label>


            <input
                type="email"
                id="email"
                required
                placeholder="Enter your email"
                autocomplete="email"
            >



            <!-- PASSWORD -->

            <label for="password">

                Password

            </label>


            <input
                type="password"
                id="password"
                required
                minlength="6"
                placeholder="Create a password"
                autocomplete="new-password"
            >



            <!-- ACCOUNT TYPE -->

            <label for="account_type">

                Account Type

            </label>


            <select
                id="account_type"
                required
            >

                <option value="">

                    Select account type

                </option>


                <option value="tenant">

                    Tenant

                </option>


                <option value="landlord">

                    Landlord

                </option>

            </select>



            <!-- CREATE ACCOUNT -->

            <button
                type="submit"
                id="register-button"
            >

                Create Account

            </button>


        </form>



        <!-- =================================================
             STATUS MESSAGE
        ================================================== -->

        <p id="register-message"></p>



        <!-- =================================================
             LOGIN
        ================================================== -->

        <p class="login-link">

            Already have an account?

            <a href="login.html">

                Login

            </a>

        </p>


    </section>


</main>



<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="supabase.js"></script>



<!-- =====================================================
     REGISTRATION JAVASCRIPT
===================================================== -->

<script>


const registerForm =
    document.getElementById(
        "register-form"
    );


const registerButton =
    document.getElementById(
        "register-button"
    );


const registerMessage =
    document.getElementById(
        "register-message"
    );



/* =====================================================
   FORM SUBMISSION
===================================================== */

registerForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* =============================================
           GET FORM VALUES
        ============================================= */

        const fullName =
    document
        .getElementById(
            "full_name"
        )
        .value
        .trim();

if (
    !fullName ||
    fullName.length < 2 ||
    fullName.length > 100
) {
    throw new Error(
        "Please enter a valid full name between 2 and 100 characters."
    );
}


        const phone =
    document
        .getElementById(
            "phone"
        )
        .value
        .trim();

if (
    !/^(?:07|01)\d{8}$/.test(phone)
) {
    throw new Error(
        "Please enter a valid Kenyan phone number, e.g. 0712345678."
    );
}


        const email =
    document
        .getElementById(
            "email"
        )
        .value
        .trim()
        .toLowerCase();

if (
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ||
    email.length > 254
) {
    throw new Error(
        "Please enter a valid email address."
    );
}


        const password =
    document
        .getElementById(
            "password"
        )
        .value;

if (
    password.length < 8 ||
    password.length > 72
) {
    throw new Error(
        "Password must be between 8 and 72 characters."
    );
}


        const accountType =
    document
        .getElementById(
            "account_type"
        )
        .value
        .trim()
        .toLowerCase();

const allowedAccountTypes = [
    "tenant",
    "landlord"
];

if (
    !allowedAccountTypes.includes(
        accountType
    )
) {
    throw new Error(
        "Please select a valid account type."
    );
}



        /* =============================================
           ACCOUNT TYPE VALIDATION
        ============================================= */

        if (!accountType) {

            registerMessage.style.color =
                "#B42318";


            registerMessage.textContent =
                "Please select an account type.";


            return;

        }



        /* =============================================
           BUTTON LOADING STATE
        ============================================= */

        registerButton.disabled =
            true;


        registerButton.textContent =
            "Creating account...";


        registerMessage.textContent =
            "";



        try {


            /* =========================================
               CREATE SUPABASE ACCOUNT
            ========================================= */

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .signUp({

                        email:
                            email,

                        password:
                            password,

                        options: {

                            data: {

                                full_name:
                                    fullName,

                                phone:
                                    phone,

                                account_type:
                                    accountType

                            }

                        }

                    });



            /* =========================================
               CHECK ERROR
            ========================================= */

            if (error) {

                throw error;

            }



            if (!data.user) {

                throw new Error(
                    "Unable to create account."
                );

            }



            /* =========================================
               SUCCESS
            ========================================= */

            registerMessage.style.color =
                "#15803D";


            registerMessage.textContent =
                "Account created successfully. Please check your email to confirm your account.";


            registerForm.reset();


        }


        catch (error) {


            console.error(
                "Registration error:",
                error
            );


            registerMessage.style.color =
                "#B42318";


            registerMessage.textContent =
                error.message ||
                "Unable to create account.";


        }


        finally {


            registerButton.disabled =
                false;


            registerButton.textContent =
                "Create Account";


        }

    }
);


</script>


</body>

</html>
