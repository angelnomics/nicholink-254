
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notifications | NichoLink 254</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fb;

            color: #172033;
        }


        .notifications-page {
            min-height: 100vh;
        }


        /* =========================================
           TOP BAR
        ========================================= */

        .notifications-topbar {

            min-height: 64px;

            padding:
                10px 24px;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 20px;

            background: #ffffff;

            border-bottom:
                1px solid #e5e7eb;
        }


        .notifications-brand {

            display: flex;

            align-items: center;

            gap: 6px;

            font-size: 22px;

            font-weight: 800;
        }


        .notifications-brand span {
            color: #172033;
        }


        .notifications-brand strong {
            color: #00843d;
        }


        .dashboard-link {

            color: #172033;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;
        }


        /* =========================================
           MAIN
        ========================================= */

        .notifications-container {

            width:
                min(
                    950px,
                    calc(100% - 30px)
                );

            margin:
                25px auto 60px;
        }


        .notifications-header {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 20px;

            margin-bottom: 20px;
        }


        .notifications-header h1 {

            margin:
                0 0 5px;

            font-size: 30px;
        }


        .notifications-header p {

            margin: 0;

            color: #718096;
        }


        .mark-all-button {

            border: none;

            background: #172033;

            color: #ffffff;

            padding:
                10px 15px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 700;
        }


        .mark-all-button:hover {
            opacity: 0.9;
        }


        /* =========================================
           SUMMARY
        ========================================= */

        .notification-summary {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 18px;
        }


        .summary-badge {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 26px;

            height: 26px;

            padding:
                0 8px;

            border-radius: 999px;

            background: #00843d;

            color: #ffffff;

            font-size: 12px;

            font-weight: 800;
        }


        .notification-summary span {

            color: #718096;

            font-size: 14px;
        }


        /* =========================================
           LIST
        ========================================= */

        .notifications-list {

            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .notification-card {

            position: relative;

            display: flex;

            align-items: flex-start;

            gap: 14px;

            padding: 18px;

            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 16px;

            box-shadow:
                0 7px 25px
                rgba(0, 0, 0, 0.04);

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .notification-card:hover {

            transform:
                translateY(-2px);
        }


        .notification-card.unread {

            background:
                #f0f9f3;

            border-color:
                #ccebd8;
        }


        .notification-icon {

            width: 46px;

            height: 46px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 14px;

            background: #eef4ff;

            font-size: 22px;
        }


        .notification-content {

            flex: 1;

            min-width: 0;
        }


        .notification-content h3 {

            margin:
                0 0 5px;

            font-size: 16px;
        }


        .notification-content p {

            margin:
                0 0 7px;

            color: #4b5563;

            font-size: 14px;

            line-height: 1.55;
        }


        .notification-time {

            color: #8a94a6;

            font-size: 12px;
        }


        .notification-actions {

            display: flex;

            align-items: center;

            gap: 8px;

            flex-shrink: 0;
        }


        .notification-action {

            border: none;

            background: transparent;

            color: #00843d;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;
        }


        .notification-action:hover {
            text-decoration: underline;
        }


        .unread-dot {

            width: 9px;

            height: 9px;

            border-radius: 50%;

            background: #00843d;

            flex-shrink: 0;

            margin-top: 7px;
        }


        /* =========================================
           EMPTY
        ========================================= */

        .notifications-empty {

            padding:
                70px 20px;

            text-align: center;

            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 16px;

            color: #718096;
        }


        .notifications-empty .empty-icon {

            font-size: 44px;

            margin-bottom: 12px;
        }


        .notifications-empty h2 {

            margin:
                0 0 8px;

            color: #172033;

            font-size: 20px;
        }


        .notifications-empty p {
            margin: 0;
        }


        /* =========================================
           ERROR
        ========================================= */

        .notifications-error {

            padding: 25px;

            background: #fff5f5;

            border:
                1px solid #fecaca;

            border-radius: 14px;

            color: #b91c1c;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .notifications-topbar {

                padding:
                    10px 15px;
            }


            .notifications-container {

                width:
                    calc(100% - 20px);

                margin-top: 15px;
            }


            .notifications-header {

                align-items:
                    flex-start;

                flex-direction:
                    column;
            }


            .mark-all-button {

                width: 100%;
            }


            .notification-card {

                padding: 14px;
            }


            .notification-actions {

                align-self:
                    flex-start;
            }

        }

    </style>

</head>


<body>


<div class="notifications-page">


    <!-- =========================================
         TOP BAR
    ========================================= -->

    <header class="notifications-topbar">


        <div class="notifications-brand">

            <span>
                NichoLink
            </span>

            <strong>
                254
            </strong>

        </div>


        <a
            href="tenant-dashboard.html"
            id="dashboard-link"
            class="dashboard-link"
        >

            ← Dashboard

        </a>


    </header>



    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="notifications-container">


        <section class="notifications-header">

            <div>

                <h1>
                    Notifications
                </h1>

                <p>
                    Stay updated about your NichoLink 254 activity.
                </p>

            </div>


            <button
                type="button"
                id="mark-all-button"
                class="mark-all-button"
            >

                Mark All as Read

            </button>

        </section>



        <!-- SUMMARY -->

        <div class="notification-summary">

            <span
                id="unread-count"
                class="summary-badge"
            >
                0
            </span>

            <span>
                unread notifications
            </span>

        </div>



        <!-- LIST -->

        <section
            id="notifications-list"
            class="notifications-list"
        >

            <div class="notifications-empty">

                <div class="empty-icon">
                    🔔
                </div>

                <h2>
                    Loading notifications...
                </h2>

                <p>
                    Please wait.
                </p>

            </div>

        </section>


    </main>

</div>



<script src="supabase.js"></script>


<script>


let currentUser = null;

let notificationsChannel = null;



const notificationsList =
    document.getElementById(
        "notifications-list"
    );


const unreadCountElement =
    document.getElementById(
        "unread-count"
    );


const markAllButton =
    document.getElementById(
        "mark-all-button"
    );


const dashboardLink =
    document.getElementById(
        "dashboard-link"
    );



/* =========================================
   START
========================================= */

async function initializeNotifications() {

    try {

        /* =========================
           GET EXISTING SESSION
        ========================= */

        const {
            data: {
                session
            },
            error: sessionError
        } =
            await supabaseClient.auth.getSession();


        if (sessionError) {
            throw sessionError;
        }


        if (!session || !session.user) {

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            session.user;


        /* =========================
           LOAD PROFILE
        ========================= */

        const {
            data: profile,
            error: profileError
        } =
            await supabaseClient

                .from("profiles")

                .select(`
                    id,
                    full_name,
                    account_type,
                    is_active
                `)

                .eq(
                    "id",
                    currentUser.id
                )

                .maybeSingle();


        if (profileError) {
            throw profileError;
        }


        if (!profile) {

            throw new Error(
                "Your profile could not be found."
            );

        }


        if (
            profile.is_active === false
        ) {

            await supabaseClient.auth.signOut();

            window.location.href =
                "login.html";

            return;

        }


        /* =========================
           DASHBOARD LINK
        ========================= */

        const accountType =
            String(
                profile.account_type ||
                ""
            )
            .trim()
            .toLowerCase();


        dashboardLink.href =
            accountType === "landlord"
                ? "landlord-dashboard.html"
                : "tenant-dashboard.html";


        /* =========================
           LOAD NOTIFICATIONS
        ========================= */

        await loadNotifications();


        subscribeToNotifications();

    }

    catch (error) {

        console.error(
            "Notifications initialization error:",
            error
        );


        notificationsList.innerHTML = `

            <div class="notifications-error">

                <strong>
                    Unable to load notifications.
                </strong>

                <br><br>

                ${escapeHtml(
                    error.message ||
                    "Unknown error"
                )}

            </div>

        `;

    }

}



/* =========================================
   LOAD NOTIFICATIONS
========================================= */

async function loadNotifications() {

    const {

        data: notifications,
        error

    } =
        await supabaseClient

            .from("notifications")

            .select(`
                id,
                type,
                title,
                message,
                link,
                is_read,
                created_at
            `)

            .eq(
                "user_id",
                currentUser.id
            )

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {
        throw error;
    }


    renderNotifications(
        notifications || []
    );

}



/* =========================================
   RENDER
========================================= */

function renderNotifications(
    notifications
) {

    notificationsList.innerHTML =
        "";


    const unread =
        notifications.filter(
            function(notification) {

                return notification.is_read
                    === false;

            }
        ).length;


    unreadCountElement.textContent =
        unread;



    if (
        notifications.length === 0
    ) {

        notificationsList.innerHTML = `

            <div class="notifications-empty">

                <div class="empty-icon">
                    🔔
                </div>

                <h2>
                    No notifications yet
                </h2>

                <p>
                    New activity will appear here.
                </p>

            </div>

        `;

        return;

    }



    notifications.forEach(
        function(notification) {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "notification-card" +
                (
                    notification.is_read
                        ? ""
                        : " unread"
                );


            const icon =
                getNotificationIcon(
                    notification.type
                );


            card.innerHTML = `

                <div class="notification-icon">
                    ${icon}
                </div>


                <div class="notification-content">

                    <h3>
                        ${escapeHtml(
                            notification.title
                        )}
                    </h3>


                    <p>
                        ${escapeHtml(
                            notification.message
                        )}
                    </p>


                    <div class="notification-time">

                        ${formatNotificationDate(
                            notification.created_at
                        )}

                    </div>

                </div>


                <div class="notification-actions">

                    ${
                        notification.is_read
                            ? ""
                            :
                            `
                            <span
                                class="unread-dot"
                                title="Unread"
                            ></span>
                            `
                    }


                    ${
                        notification.link
                            ?
                            `
                            <button
                                type="button"
                                class="notification-action"
                                data-action="open"
                            >
                                Open
                            </button>
                            `
                            :
                            ""
                    }


                    ${
                        notification.is_read
                            ?
                            ""
                            :
                            `
                            <button
                                type="button"
                                class="notification-action"
                                data-action="read"
                            >
                                Mark read
                            </button>
                            `
                    }

                </div>

            `;



            /* =========================
               OPEN
            ========================= */

            const openButton =
                card.querySelector(
                    '[data-action="open"]'
                );


            if (openButton) {

                openButton.addEventListener(
                    "click",
                    async function() {

                        try {

                            await markNotificationRead(
                                notification.id
                            );


                            window.location.href =
                                notification.link;

                        }

                        catch (error) {

                            console.error(
                                "Open notification error:",
                                error
                            );

                        }

                    }
                );

            }



            /* =========================
               MARK READ
            ========================= */

            const readButton =
                card.querySelector(
                    '[data-action="read"]'
                );


            if (readButton) {

                readButton.addEventListener(
                    "click",
                    async function() {

                        await markNotificationRead(
                            notification.id
                        );

                    }
                );

            }


            notificationsList.appendChild(
                card
            );

        }
    );

}



/* =========================================
   MARK ONE READ
========================================= */

async function markNotificationRead(
    notificationId
) {

    const {
        error
    } =
        await supabaseClient

            .from("notifications")

            .update({
                is_read: true
            })

            .eq(
                "id",
                notificationId
            )

            .eq(
                "user_id",
                currentUser.id
            );


    if (error) {
        throw error;
    }


    await loadNotifications();

}



/* =========================================
   MARK ALL READ
========================================= */

markAllButton.addEventListener(
    "click",
    async function() {

        try {

            markAllButton.disabled =
                true;


            const {
                error
            } =
                await supabaseClient

                    .from("notifications")

                    .update({
                        is_read: true
                    })

                    .eq(
                        "user_id",
                        currentUser.id
                    )

                    .eq(
                        "is_read",
                        false
                    );


            if (error) {
                throw error;
            }


            await loadNotifications();

        }

        catch (error) {

            console.error(
                "Mark all read error:",
                error
            );


            alert(
                error.message ||
                "Unable to mark notifications as read."
            );

        }

        finally {

            markAllButton.disabled =
                false;

        }

    }
);



/* =========================================
   REALTIME
========================================= */

function subscribeToNotifications() {

    if (
        notificationsChannel
    ) {

        supabaseClient
            .removeChannel(
                notificationsChannel
            );

    }


    notificationsChannel =
        supabaseClient

            .channel(
                "notifications-" +
                currentUser.id
            )

            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "notifications",
                    filter:
                        "user_id=eq." +
                        currentUser.id
                },
                async function(payload) {

                    console.log(
                        "New notification:",
                        payload.new
                    );


                    await loadNotifications();

                }
            )

            .on(
                "postgres_changes",
                {
                    event: "UPDATE",
                    schema: "public",
                    table: "notifications",
                    filter:
                        "user_id=eq." +
                        currentUser.id
                },
                async function() {

                    await loadNotifications();

                }
            )

            .subscribe(
                function(status) {

                    console.log(
                        "Notification realtime status:",
                        status
                    );

                }
            );

}



/* =========================================
   ICONS
========================================= */

function getNotificationIcon(
    type
) {

    const normalized =
        String(
            type || ""
        )
        .trim()
        .toLowerCase();


    if (
        normalized.includes(
            "message"
        )
    ) {

        return "💬";

    }


    if (
        normalized.includes(
            "viewing"
        )
    ) {

        return "📅";

    }


    if (
        normalized.includes(
            "approved"
        )
    ) {

        return "✅";

    }


    if (
        normalized.includes(
            "rejected"
        )
    ) {

        return "❌";

    }


    if (
        normalized.includes(
            "property"
        )
    ) {

        return "🏠";

    }


    return "🔔";

}



/* =========================================
   DATE
========================================= */

function formatNotificationDate(
    value
) {

    if (!value) {
        return "";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";
    }


    return date.toLocaleString(
        "en-KE",
        {
            day: "numeric",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================
   START
========================================= */

initializeNotifications();

</script>


</body>

</html>
```
