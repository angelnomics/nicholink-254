<script>

let allUsers = [];


/* ==============================
   LOAD USERS
============================== */

async function loadUsers() {

    const container =
        document.getElementById("users-grid");

    try {

        const {
            data,
            error
        } = await supabaseClient

            .from("profiles")

            .select(`
                id,
                full_name,
                phone,
                email,
                account_type,
                created_at,
                updated_at,
                is_active
            `)

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {
            throw error;
        }


        allUsers =
            Array.isArray(data)
                ? data
                : [];


        updateStatistics();

        renderUsers(allUsers);

    }

    catch (error) {

        console.error(
            "User loading error:",
            error
        );

        container.innerHTML = `

            <div class="empty">

                <h3>
                    Unable to load users
                </h3>

                <p>
                    ${escapeHtml(
                        error.message ||
                        "Unknown error"
                    )}
                </p>

            </div>

        `;

    }

}


/* ==============================
   STATISTICS
============================== */

function updateStatistics() {

    const total =
        allUsers.length;

    const tenants =
        allUsers.filter(
            user =>
                normalizeAccount(
                    user.account_type
                ) === "tenant"
        ).length;

    const landlords =
        allUsers.filter(
            user =>
                normalizeAccount(
                    user.account_type
                ) === "landlord"
        ).length;

    const active =
        allUsers.filter(
            user =>
                user.is_active === true
        ).length;


    document.getElementById(
        "total-users"
    ).textContent = total;

    document.getElementById(
        "total-tenants"
    ).textContent = tenants;

    document.getElementById(
        "total-landlords"
    ).textContent = landlords;

    document.getElementById(
        "active-users"
    ).textContent = active;

}


/* ==============================
   FILTER
============================== */

function filterUsers() {

    const search =
        document.getElementById(
            "user-search"
        )
        .value
        .trim()
        .toLowerCase();


    const account =
        document.getElementById(
            "account-filter"
        )
        .value;


    const filtered =
        allUsers.filter(
            user => {

                const name =
                    String(
                        user.full_name || ""
                    ).toLowerCase();

                const phone =
                    String(
                        user.phone || ""
                    ).toLowerCase();

                const email =
                    String(
                        user.email || ""
                    ).toLowerCase();

                const type =
                    normalizeAccount(
                        user.account_type
                    );


                const matchesSearch =
                    !search ||
                    name.includes(search) ||
                    phone.includes(search) ||
                    email.includes(search);


                const matchesAccount =
                    account === "all" ||
                    type === account;


                return (
                    matchesSearch &&
                    matchesAccount
                );

            }
        );


    renderUsers(filtered);

}


/* ==============================
   RENDER USER GRID
============================== */

function renderUsers(users) {

    const container =
        document.getElementById(
            "users-grid"
        );


    container.innerHTML = "";


    if (!users.length) {

        container.innerHTML = `

            <div class="empty">

                <h3>
                    No users found
                </h3>

                <p>
                    Try changing your search
                    or account filter.
                </p>

            </div>

        `;

        return;

    }


    users.forEach(
        user => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "user-card";


            const name =
                user.full_name ||
                "Unnamed User";


            const initials =
                getInitials(name);


            const account =
                normalizeAccount(
                    user.account_type
                ) || "unknown";


            const active =
                user.is_active === true;


            const created =
                formatDate(
                    user.created_at
                );


            card.innerHTML = `

                <div class="user-top">

                    <div class="avatar">
                        ${escapeHtml(initials)}
                    </div>

                    <div>

                        <h3 class="user-name">
                            ${escapeHtml(name)}
                        </h3>

                        <div class="account-type">
                            ${escapeHtml(account)}
                        </div>

                    </div>

                </div>


                <div class="user-details">

                    <div class="detail">

                        <span>Email</span>

                        <span>
                            ${escapeHtml(
                                user.email ||
                                "Not provided"
                            )}
                        </span>

                    </div>


                    <div class="detail">

                        <span>Phone</span>

                        <span>
                            ${escapeHtml(
                                user.phone ||
                                "Not provided"
                            )}
                        </span>

                    </div>


                    <div class="detail">

                        <span>Joined</span>

                        <span>
                            ${escapeHtml(created)}
                        </span>

                    </div>


                    <div class="detail">

                        <span>Status</span>

                        <span>

                            <span class="status ${
                                active
                                    ? "active"
                                    : "inactive"
                            }">

                                ${
                                    active
                                        ? "Active"
                                        : "Inactive"
                                }

                            </span>

                        </span>

                    </div>

                </div>


                <div class="user-actions">

                    <button
                        type="button"
                        class="edit-button"
                        onclick="openEditModal('${escapeHtml(user.id)}')">

                        Edit

                    </button>

                    <button
                        type="button"
                        class="${
                            active
                                ? "deactivate-button"
                                : "activate-button"
                        }"
                        onclick="changeUserStatus(
                            '${escapeHtml(user.id)}',
                            ${!active}
                        )">

                        ${
                            active
                                ? "Deactivate"
                                : "Activate"
                        }

                    </button>

                    <button
                        type="button"
                        class="delete-button"
                        onclick="deleteUser('${escapeHtml(user.id)}')">

                        Delete

                    </button>

                </div>

            `;


            container.appendChild(card);

        }
    );

}


/* ==============================
   OPEN EDIT MODAL
============================== */

function openEditModal(userId) {

    const user =
        allUsers.find(
            item =>
                String(item.id) ===
                String(userId)
        );


    if (!user) {

        alert("User not found.");

        return;

    }


    document.getElementById(
        "edit-user-id"
    ).value = user.id;


    document.getElementById(
        "edit-full-name"
    ).value =
        user.full_name || "";


    document.getElementById(
        "edit-phone"
    ).value =
        user.phone || "";


    document.getElementById(
        "edit-email"
    ).value =
        user.email || "";


    document.getElementById(
        "edit-account-type"
    ).value =
        normalizeAccount(
            user.account_type
        );


    document.getElementById(
        "edit-active"
    ).value =
        user.is_active === true
            ? "true"
            : "false";


    document.getElementById(
        "edit-user-modal"
    ).classList.add("show");

}


/* ==============================
   CLOSE EDIT MODAL
============================== */

function closeEditModal() {

    document.getElementById(
        "edit-user-modal"
    ).classList.remove("show");

}


/* ==============================
   SAVE EDITED USER
============================== */

document.getElementById(
    "edit-user-form"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const userId =
            document.getElementById(
                "edit-user-id"
            ).value;


        const fullName =
            document.getElementById(
                "edit-full-name"
            ).value.trim();


        const phone =
            document.getElementById(
                "edit-phone"
            ).value.trim();


        const email =
            document.getElementById(
                "edit-email"
            ).value.trim();


        const accountType =
            document.getElementById(
                "edit-account-type"
            ).value;


        const isActive =
            document.getElementById(
                "edit-active"
            ).value === "true";


        if (!userId || !fullName) {

            alert(
                "Full name is required."
            );

            return;

        }


        try {

            const {
                data,
                error
            } = await supabaseClient

                .from("profiles")

                .update({
                    full_name: fullName,
                    phone: phone || null,
                    email: email || null,
                    account_type: accountType,
                    is_active: isActive,
                    updated_at:
                        new Date().toISOString()
                })

                .eq(
                    "id",
                    userId
                )

                .select();


            if (error) {
                throw error;
            }


            if (
                !data ||
                data.length === 0
            ) {

                throw new Error(
                    "User was not updated. Check your Supabase UPDATE policy."
                );

            }


            closeEditModal();

            requireAdmin().then(function(isAdmin) {

    if (isAdmin) {
        loadUsers();
    }

});


        }

        catch (error) {

            console.error(
                "Edit user error:",
                error
            );


            alert(
                "Unable to update user.\n\n" +
                (
                    error.message ||
                    "Unknown error"
                )
            );

        }

    }
);


/* ==============================
   CHANGE USER STATUS
============================== */

async function changeUserStatus(
    userId,
    newStatus
) {

    if (!userId) {
        return;
    }


    const action =
        newStatus
            ? "activate"
            : "deactivate";


    const confirmed =
        confirm(
            `Are you sure you want to ${action} this user?`
        );


    if (!confirmed) {
        return;
    }


    try {

        const {
            data,
            error
        } = await supabaseClient

            .from("profiles")

            .update({
                is_active: newStatus,
                updated_at:
                    new Date().toISOString()
            })

            .eq(
                "id",
                userId
            )

            .select();


        if (error) {
            throw error;
        }


        if (
            !data ||
            data.length === 0
        ) {

            throw new Error(
                "User status was not updated. Check your Supabase UPDATE policy."
            );

        }


        await loadUsers();

    }

    catch (error) {

        console.error(
            "User status error:",
            error
        );


        alert(
            "Unable to change user status.\n\n" +
            (
                error.message ||
                "Unknown error"
            )
        );

    }

}


/* ==============================
   DELETE USER
============================== */

async function deleteUser(userId) {

    if (!userId) {
        return;
    }


    const user =
        allUsers.find(
            item =>
                String(item.id) ===
                String(userId)
        );


    const userName =
        user &&
        user.full_name
            ? user.full_name
            : "this user";


    const confirmed =
        confirm(
            `Delete ${userName} permanently?\n\nThis action cannot be undone.`
        );


    if (!confirmed) {
        return;
    }


    try {

        const {
            data,
            error
        } = await supabaseClient

            .from("profiles")

            .delete()

            .eq(
                "id",
                userId
            )

            .select();


        if (error) {
            throw error;
        }


        if (
            !data ||
            data.length === 0
        ) {

            throw new Error(
                "User was not deleted. Check your Supabase DELETE policy."
            );

        }


        await loadUsers();


    }

    catch (error) {

        console.error(
            "Delete user error:",
            error
        );


        alert(
            "Unable to delete user.\n\n" +
            (
                error.message ||
                "Unknown error"
            )
        );

    }

}


/* ==============================
   MODAL CLICK OUTSIDE
============================== */

document.getElementById(
    "edit-user-modal"
).addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            this
        ) {

            closeEditModal();

        }

    }
);


/* ==============================
   HELPERS
============================== */

function normalizeAccount(value) {

    return String(
        value || ""
    )
    .trim()
    .toLowerCase();

}


function getInitials(name) {

    const parts =
        String(name)
            .trim()
            .split(/\s+/)
            .filter(Boolean);


    if (!parts.length) {
        return "?";
    }


    if (parts.length === 1) {

        return parts[0]
            .substring(0, 2)
            .toUpperCase();

    }


    return (
        parts[0][0] +
        parts[parts.length - 1][0]
    ).toUpperCase();

}


function formatDate(value) {

    if (!value) {
        return "Unknown";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "Unknown";

    }


    return date.toLocaleDateString(
