
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | NichoLink 254</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        /* =========================================
           LOGIN PAGE
        ========================================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            min-height: 100%;
        }


        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #172033;
        }


        /* =========================================
           FULL PAGE BACKGROUND
        ========================================= */

        .login-page {

            min-height: 100vh;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px 20px;

            overflow: hidden;

            background-image:
                linear-gradient(
                    rgba(8, 45, 29, 0.42),
                    rgba(120, 25, 25, 0.42)
                ),
                url("images/Nicholink_254_logo.png");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;
        }


        /* =========================================
           PROFESSIONAL BACKGROUND OVERLAY
        ========================================= */

        .login-page::before {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 132, 61, 0.18),
                    rgba(190, 28, 28, 0.18)
                );

            z-index: 0;

            pointer-events: none;
        }


        /* =========================================
           LOGIN CARD
        ========================================= */

        .login-card {

            width: 100%;

            max-width: 450px;

            position: relative;

            z-index: 2;

            padding: 38px;

            background:
                rgba(255, 255, 255, 0.97);

            border:
                1px solid
                rgba(255, 255, 255, 0.85);

            border-radius: 22px;

            box-shadow:
                0 30px 80px
                rgba(0, 0, 0, 0.25);

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);
        }


        /* =========================================
           CARD HEADER
        ========================================= */

        .login-brand {

            text-align: center;

            margin-bottom: 26px;
        }


        .login-brand-mark {

            width: 58px;

            height: 58px;

            margin: 0 auto 16px;

            border-radius: 16px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #00843d,
                    #c62828
                );

            color: white;

            font-size: 24px;

            font-weight: 900;

            box-shadow:
                0 10px 25px
                rgba(0, 0, 0, 0.14);
        }


        .login-card h1 {

            margin: 0 0 8px;

            color: #172033;

            font-size: 31px;

            line-height: 1.2;

            font-weight: 800;
        }


        .login-intro {

            margin: 0;

            color: #718096;

            font-size: 15px;

            line-height: 1.6;
        }


        /* =========================================
           FORM
        ========================================= */

        .login-form-group {

            margin-bottom: 19px;
        }


        .login-form-group label {

            display: block;

            margin-bottom: 8px;

            color: #27352e;

            font-size: 14px;

            font-weight: 700;
        }


        .login-input-wrapper {

            position: relative;
        }


        .login-input {

            width: 100%;

            height: 50px;

            padding:
                0 15px;

            border:
                1px solid
                #d9e0dc;

            border-radius: 11px;

            background: #ffffff;

            color: #172033;

            font-family: inherit;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        .login-input:focus {

            border-color: #00843d;

            box-shadow:
                0 0 0 3px
                rgba(0, 132, 61, 0.10);

            background: #ffffff;
        }


        .password-input {

            padding-right: 92px;
        }


        /* =========================================
           SHOW PASSWORD
        ========================================= */

        .show-password {

            position: absolute;

            top: 50%;

            right: 10px;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #00843d;

            font-size: 12px;

            font-weight: 800;

            cursor: pointer;

            padding: 7px 8px;

            border-radius: 7px;
        }


        .show-password:hover {

            background:
                rgba(0, 132, 61, 0.08);
        }


        /* =========================================
           LOGIN OPTIONS
        ========================================= */

        .login-options {

            display: flex;

            justify-content: flex-end;

            margin-top: -7px;

            margin-bottom: 22px;
        }


        .forgot-password {

            color: #00843d;

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;
        }


        .forgot-password:hover {

            text-decoration: underline;
        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        #login-button {

            width: 100%;

            min-height: 52px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #00843d,
                    #006b31
                );

            color: #ffffff;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 10px 22px
                rgba(0, 132, 61, 0.20);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }


        #login-button:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 14px 28px
                rgba(0, 132, 61, 0.25);
        }


        #login-button:disabled {

            opacity: 0.65;

            cursor: wait;

            transform: none;

            box-shadow: none;
        }


        /* =========================================
           MESSAGE
        ========================================= */

        #login-message {

            min-height: 20px;

            margin:
                18px 0 0;

            text-align: center;

            font-size: 13px;

            line-height: 1.5;

            font-weight: 600;
        }


        /* =========================================
           REGISTER LINK
        ========================================= */

        .register-link {

            margin:
                25px 0 0;

            padding-top: 21px;

            border-top:
                1px solid
                #edf0ee;

            text-align: center;

            color: #66736c;

            font-size: 14px;

            line-height: 1.5;
        }


        .register-link a {

            color: #00843d;

            font-weight: 800;

            text-decoration: none;
        }


        .register-link a:hover {

            text-decoration: underline;
        }


        /* =========================================
           SECURITY NOTE
        ========================================= */

        .login-security {

            margin-top: 20px;

            text-align: center;

            color: #8a948e;

            font-size: 12px;

            line-height: 1.5;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .login-page {

                min-height: 100vh;

                padding:
                    25px 15px;

                background-attachment: scroll;

                background-position: center;
            }


            .login-card {

                max-width: 430px;

                padding:
                    30px 23px;

                border-radius: 18px;
            }


            .login-card h1 {

                font-size: 28px;
            }


            .login-brand-mark {

                width: 52px;

                height: 52px;

                font-size: 21px;
            }
        }


        @media (max-width: 420px) {

            .login-page {

                padding:
                    20px 12px;
            }


            .login-card {

                padding:
                    26px 18px;

                border-radius: 16px;
            }


            .login-card h1 {

                font-size: 26px;
            }
        }

    </style>

</head>


<body>


<!-- =========================================
     LOGIN PAGE
========================================= -->

<main class="login-page">


    <section
        class="login-card"
        aria-labelledby="login-title"
    >


        <!-- CARD HEADER -->

        <div class="login-brand">

            <div
                class="login-brand-mark"
                aria-hidden="true"
            >
                N
            </div>


            <h1 id="login-title">
                Welcome Back
            </h1>


            <p class="login-intro">
                Sign in to your NichoLink 254 account
                to continue.
            </p>

        </div>



        <!-- LOGIN FORM -->

        <form id="login-form">


            <!-- EMAIL -->

            <div class="login-form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    class="login-input"
                    required
                    autocomplete="email"
                    placeholder="Enter your email"
                >

            </div>



            <!-- PASSWORD -->

            <div class="login-form-group">

                <label for="password">
                    Password
                </label>


                <div class="login-input-wrapper">

                    <input
                        type="password"
                        id="password"
                        class="login-input password-input"
                        required
                        autocomplete="current-password"
                        placeholder="Enter your password"
                    >


                    <button
                        type="button"
                        class="show-password"
                        id="show-password"
                        aria-label="Show password"
                    >
                        Show
                    </button>

                </div>

            </div>



            <!-- FORGOT PASSWORD -->

            <div class="login-options">

                <a
                    href="forgot-password.html"
                    class="forgot-password"
                >
                    Forgot password?
                </a>

            </div>



            <!-- LOGIN -->

            <button
                type="submit"
                id="login-button"
            >
                Login
            </button>


        </form>



        <!-- MESSAGE -->

        <p
            id="login-message"
            role="alert"
        ></p>



        <!-- REGISTER -->

        <p class="register-link">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>



        <!-- SECURITY -->

        <p class="login-security">

            Your account information is securely
            handled through NichoLink 254 authentication.

        </p>


    </section>


</main>



<!-- =========================================
     SUPABASE
========================================= -->

<script src="supabase.js"></script>



<script>

const loginForm =
    document.getElementById(
        "login-form"
    );


const loginButton =
    document.getElementById(
        "login-button"
    );


const loginMessage =
    document.getElementById(
        "login-message"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const showPasswordButton =
    document.getElementById(
        "show-password"
    );



/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

showPasswordButton.addEventListener(
    "click",
    function() {

        const isPassword =
            passwordInput.type === "password";


        passwordInput.type =
            isPassword
                ? "text"
                : "password";


        showPasswordButton.textContent =
            isPassword
                ? "Hide"
                : "Show";


        showPasswordButton.setAttribute(
            "aria-label",
            isPassword
                ? "Hide password"
                : "Show password"
        );

    }
);



/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            passwordInput.value;
/* =====================================================
   INPUT PROTECTION
===================================================== */

if (!email) {
    throw new Error(
        "Please enter your email address."
    );
}

if (email.length > 254) {
    throw new Error(
        "Email address is too long."
    );
}

if (
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
) {
    throw new Error(
        "Please enter a valid email address."
    );
}


if (!password) {
    throw new Error(
        "Please enter your password."
    );
}

if (password.length > 128) {
    throw new Error(
        "Password is too long."
    );
}

        loginMessage.textContent =
            "";


        loginButton.disabled =
            true;


        loginButton.textContent =
            "Logging in...";


        try {


            /* =============================
               SUPABASE LOGIN
            ============================= */

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .signInWithPassword({

                        email:
                            email,

                        password:
                            password

                    });


            if (error) {

                throw error;

            }


            if (!data.user) {

                throw new Error(
                    "Login failed."
                );

            }



            /* =============================
               GET USER PROFILE
            ============================= */

            const {
                data: profile,
                error: profileError
            } =
                await supabaseClient

                    .from("profiles")

                    .select(`
                        id,
                        full_name,
                        account_type,
                        is_active
                    `)

                    .eq(
                        "id",
                        data.user.id
                    )

                    .maybeSingle();


            if (profileError) {

                throw profileError;

            }


            if (!profile) {

                await supabaseClient
                    .auth
                    .signOut();

                throw new Error(
                    "Your account profile could not be found."
                );

            }



            /* =============================
               CHECK ACCOUNT STATUS
            ============================= */

            if (
                profile.is_active === false
            ) {

                await supabaseClient
                    .auth
                    .signOut();

                throw new Error(
                    "Your account has been deactivated. Please contact NichoLink 254."
                );

            }



            /* =============================
               NORMALIZE ACCOUNT TYPE
            ============================= */

            const accountType =
                String(
                    profile.account_type ||
                    ""
                )
                .trim()
                .toLowerCase();



            /* =============================
               ADMIN
            ============================= */

            if (
                accountType === "admin" ||
                accountType === "administrator"
            ) {

                window.location.href =
                    "admin-dashboard.html";

                return;

            }



            /* =============================
               LANDLORD
            ============================= */

            if (
                accountType === "landlord"
            ) {

                window.location.href =
                    "landlord-dashboard.html";

                return;

            }



            /* =============================
               TENANT
            ============================= */

            if (
                accountType === "tenant"
            ) {

                window.location.href =
                    "tenant-dashboard.html";

                return;

            }



            /* =============================
               UNKNOWN ACCOUNT TYPE
            ============================= */

            await supabaseClient
                .auth
                .signOut();


            throw new Error(
                "Your account type is not configured correctly. Please contact NichoLink 254."
            );


        }


        catch (error) {

            console.error(
                "Login error:",
                error
            );


            loginMessage.style.color =
                "#b91c1c";


            loginMessage.textContent =
                error.message ||
                "Unable to login.";


            loginButton.disabled =
                false;


            loginButton.textContent =
                "Login";

        }

    }
);

</script>


</body>

</html>
```
