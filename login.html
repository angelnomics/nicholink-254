<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | NichoLink 254</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<header class="navbar">

    <div class="logo">
        <span>NichoLink</span>
        <strong>254</strong>
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="properties.html">
            Properties
        </a>

        <a href="register.html">
            Register
        </a>

    </nav>

</header>



<main style="
    min-height:75vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
">


    <section style="
        width:100%;
        max-width:450px;
        background:white;
        padding:35px;
        border-radius:20px;
        box-shadow:0 10px 35px rgba(0,0,0,.08);
    ">


        <h1 style="
            margin-top:0;
            margin-bottom:8px;
        ">
            Welcome Back
        </h1>


        <p style="
            color:#718096;
            margin-bottom:30px;
        ">
            Login to your NichoLink 254 account.
        </p>



        <form id="login-form">


            <!-- EMAIL -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                required
                placeholder="Enter your email"
                style="
                    width:100%;
                    padding:14px;
                    margin:8px 0 18px;
                    border:1px solid #ddd;
                    border-radius:10px;
                "
            >



            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                required
                placeholder="Enter your password"
                style="
                    width:100%;
                    padding:14px;
                    margin:8px 0 25px;
                    border:1px solid #ddd;
                    border-radius:10px;
                "
            >



            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                id="login-button"
                style="
                    width:100%;
                    padding:14px;
                    border:none;
                    border-radius:10px;
                    background:#172033;
                    color:white;
                    font-size:16px;
                    font-weight:bold;
                    cursor:pointer;
                "
            >
                Login
            </button>


        </form>



        <!-- MESSAGE -->

        <p
            id="login-message"
            style="
                margin-top:20px;
                text-align:center;
            "
        ></p>



        <p style="
            text-align:center;
            margin-top:25px;
        ">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>


    </section>


</main>



<script src="supabase.js"></script>


<script>


const loginForm =
    document.getElementById(
        "login-form"
    );


const loginButton =
    document.getElementById(
        "login-button"
    );


const loginMessage =
    document.getElementById(
        "login-message"
    );



/* =================================
   LOGIN
================================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";

        loginMessage.textContent =
            "";



        try {


            /* =============================
               SUPABASE LOGIN
            ============================= */

            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


            if (error) {

                throw error;

            }


            if (!data.user) {

                throw new Error(
                    "Login failed."
                );

            }



            /* =============================
               GET USER PROFILE
            ============================= */

            const {
                data: profile,
                error: profileError
            } =
                await supabaseClient

                    .from("profiles")

                    .select(`
                        id,
                        full_name,
                        account_type,
                        is_active
                    `)

                    .eq(
                        "id",
                        data.user.id
                    )

                    .maybeSingle();



            if (profileError) {

                throw profileError;

            }



            if (!profile) {

                await supabaseClient.auth.signOut();

                throw new Error(
                    "Your account profile could not be found."
                );

            }



            /* =============================
               CHECK ACCOUNT STATUS
            ============================= */

            if (
                profile.is_active === false
            ) {

                await supabaseClient.auth.signOut();

                throw new Error(
                    "Your account has been deactivated. Please contact NichoLink 254."
                );

            }



            /* =============================
               NORMALIZE ACCOUNT TYPE
            ============================= */

            const accountType =
                String(
                    profile.account_type ||
                    ""
                )
                .trim()
                .toLowerCase();



            /* =============================
               ADMIN
            ============================= */

            if (
                accountType === "admin" ||
                accountType === "administrator"
            ) {

                window.location.href =
                    "admin-dashboard.html";

                return;

            }



            /* =============================
               LANDLORD
            ============================= */

            if (
                accountType === "landlord"
            ) {

                window.location.href =
                    "landlord-dashboard.html";

                return;

            }



            /* =============================
               TENANT
            ============================= */

            if (
                accountType === "tenant"
            ) {

                window.location.href =
                    "tenant-dashboard.html";

                return;

            }



            /* =============================
               UNKNOWN ACCOUNT TYPE
            ============================= */

            await supabaseClient.auth.signOut();

            throw new Error(
                "Your account type is not configured correctly. Please contact NichoLink 254."
            );


        }


        catch (error) {

            console.error(
                "Login error:",
                error
            );


            loginMessage.style.color =
                "#b91c1c";


            loginMessage.textContent =
                error.message ||
                "Unable to login.";


            loginButton.disabled =
                false;


            loginButton.textContent =
                "Login";

            return;

        }

    }
);


</script>


</body>

</html>
